name: Patch coverage UI once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/patch-coverage-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch index
        run: python tools/patch_coverage_ui.py

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Expose coverage XLSX export to all users"
          git push
