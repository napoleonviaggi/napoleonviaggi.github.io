name: Napoleon Audit V4.1 backend smoke
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check backend V4.1
        shell: bash
        run: |
          set -euo pipefail
          API='https://nohwlxuyxcdxihpleooh.supabase.co/functions/v1/napoleon-audit-api-v4'
          code=$(curl -sS -o /tmp/noauth -w '%{http_code}' -H 'Origin: https://napoleonviaggi.github.io' "$API?api=audit-data")
          test "$code" = '401'
          grep -q 'Accesso richiesto' /tmp/noauth
          code=$(curl -sS -o /tmp/login -w '%{http_code}' -X POST -H 'Origin: https://napoleonviaggi.github.io' -H 'Content-Type: application/json' --data '{"display_name":"Marco"}' "$API?api=login-options")
          test "$code" = '200'
          grep -q 'challenge_id' /tmp/login
          headers=$(curl -sSI -X OPTIONS -H 'Origin: https://napoleonviaggi.github.io' -H 'Access-Control-Request-Method: POST' "$API?api=login-options")
          printf '%s' "$headers" | tr -d '\r' | grep -qi '^access-control-allow-origin: https://napoleonviaggi.github.io$'
          echo 'V4.1 backend smoke: OK'