name: Patch Audit UI V4.2
on:
  push:
    branches: [main]
    paths: ['.github/workflows/patch-ui-v42.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index.html
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          reps=[]
          reps.append((
            '.kpis{display:grid;grid-template-columns:repeat(7,minmax(100px,1fr));gap:8px}',
            '.kpis{display:grid;grid-template-columns:repeat(7,minmax(100px,1fr));gap:8px}.topkpis{grid-template-columns:repeat(9,minmax(85px,1fr))}'
          ))
          reps.append(('th{position:sticky;top:0;z-index:2;background:#eef2f6;text-align:left;color:#344054;padding:8px 5px;', 'th{position:sticky;top:0;z-index:2;background:#eef2f6;text-align:left;color:#344054;padding:8px 4px;'))
          reps.append(('td{padding:8px 5px;', 'td{padding:8px 4px;'))
          reps.append(('V4.1 · lavoro sincronizzato · storico campagne · presa in carico','V4.2 · lavoro sincronizzato · storico campagne · presa in carico · censimento live'))
          reps.append(('<section class="kpis"><div class="kpi"><small>Da controllare</small>', '<section class="kpis topkpis"><div class="kpi"><small>Da controllare</small>'))
          reps.append((
            '<div class="kpi"><small>USO INTERNO rilevati</small><b id="kf">0</b></div><div class="kpi"><small>Avanzamento</small><b><span id="kd">0</span>/<span id="ka">0</span></b><div class="bar"><i id="prog"></i></div></div>',
            '<div class="kpi"><small>File USO INTERNO</small><b id="kf">0</b></div><div class="kpi"><small>Strutture con USO INT.</small><b><span id="ks">0</span>/<span id="kt">0</span></b></div><div class="kpi"><small>USO INTERNO mancanti</small><b id="km">0</b></div><div class="kpi"><small>Avanzamento</small><b><span id="kd">0</span>/<span id="ka">0</span></b><div class="bar"><i id="prog"></i></div></div>'
          ))
          reps.append((
            '<div class="wrap"><table><colgroup><col style="width:8%"><col style="width:4%"><col style="width:6.5%"><col style="width:5.5%"><col style="width:7%"><col style="width:4.5%"><col style="width:7%"><col style="width:7%"><col style="width:34%"><col style="width:7%"><col style="width:9.5%"></colgroup><thead><tr><th>Operazione</th><th>Dest.</th><th>Struttura</th><th>Campo</th><th>Audit</th><th>Gravità</th><th>Assegnazione</th><th>Azione consigliata</th><th>Confronto / evidenza</th><th>Fonti</th><th>Esito / nota</th></tr></thead><tbody id="tbody"></tbody></table></div>',
            '<div class="wrap"><table><colgroup><col style="width:7%"><col style="width:2.5%"><col style="width:6%"><col style="width:5%"><col style="width:5.5%"><col style="width:2.5%"><col style="width:5%"><col style="width:9.5%"><col style="width:50%"><col style="width:7%"></colgroup><thead><tr><th>Operazione</th><th>Dest.</th><th>Struttura</th><th>Campo</th><th>Audit</th><th>Gravità</th><th>Assegnazione</th><th>Azione consigliata</th><th>Confronto / evidenza</th><th>Fonti</th></tr></thead><tbody id="tbody"></tbody></table></div>'
          ))
          reps.append((
            "function status(id){return progress[id]?.resolution_status||'pending'}function assignment(id){return assignments[id]||null}",
            "function status(id){return progress[id]?.resolution_status||'pending'}function assignment(id){return assignments[id]||null}function structureMetrics(){const active=structures.filter(r=>r.napoleon_active&&r.live_napoleon_status==='live').length,covered=Math.min(Number(campaign?.internal_structures_count||0),active);return{active,covered,missing:Math.max(0,active-covered)}}"
          ))
          reps.append((
            "let cmp=`${cmpBadge(r)}<br><b>USO INTERNO:</b> ${esc(r['Dato Uso Interno'])}<br><b>Napoleon:</b> ${esc(r['Dato Napoleon'])}<br><b>Esterno/evidenza:</b> ${esc(r['Dato esterno attuale / evidenza'])}<br><b>Nota audit:</b> ${esc(r.Note)}<div class=\"small\"><b>File:</b> ${esc(r['File origine'])}</div>`;return`<tr class=\"${positive?'positive':done?'done':''}\"><td>${actionsCell(r)}</td><td>${esc(r.Destinazione)}</td><td class=\"structure\">${esc(r.Struttura)}</td><td>${esc(r.Campo)}</td><td>${aud(r.Stato)}</td><td>${esc(r.Gravità)}</td><td>${assignmentCell(r)}</td><td>${esc(r['Azione consigliata'])}</td><td>${cmp}</td><td>${src(r)}</td><td>${result(r,st)}</td></tr>`",
            "let res=(st!=='pending'||positive)?`<div style=\"margin-top:7px\">${result(r,st)}</div>`:'';let cmp=`${cmpBadge(r)}<br><b>USO INTERNO:</b> ${esc(r['Dato Uso Interno'])}<br><b>Napoleon:</b> ${esc(r['Dato Napoleon'])}<br><b>Esterno/evidenza:</b> ${esc(r['Dato esterno attuale / evidenza'])}<br><b>Nota audit:</b> ${esc(r.Note)}<div class=\"small\"><b>File:</b> ${esc(r['File origine'])}</div>${res}`;return`<tr class=\"${positive?'positive':done?'done':''}\"><td>${actionsCell(r)}</td><td>${esc(r.Destinazione)}</td><td class=\"structure\">${esc(r.Struttura)}</td><td>${esc(r.Campo)}</td><td>${aud(r.Stato)}</td><td>${esc(r.Gravità)}</td><td>${assignmentCell(r)}</td><td>${esc(r['Azione consigliata'])}</td><td>${cmp}</td><td>${src(r)}</td></tr>`"
          ))
          reps.append((
            "$('kf').textContent=campaign?.internal_files_count||0;$('kd').textContent=v+b+o;",
            "$('kf').textContent=campaign?.internal_files_count||0;let sm=structureMetrics();$('ks').textContent=sm.covered;$('kt').textContent=sm.active;$('km').textContent=sm.missing;$('kd').textContent=v+b+o;"
          ))
          reps.append((
            "async function loadStructures(s=false){try{let d=await api('structures');structures=d.rows||[];renderStructures()}catch(e){if(!s)toastMsg(e.message)}}",
            "async function loadStructures(s=false){try{let d=await api('structures');structures=d.rows||[];renderStructures();if(data)render()}catch(e){if(!s)toastMsg(e.message)}}"
          ))
          old="function renderStructures(){let q=$('strq').value.trim().toLowerCase(),rr=structures.filter(r=>!q||(r.canonical_name+' '+r.destination).toLowerCase().includes(q));const targets={Elba:145,Sardegna:137,Toscana:108,Corsica:78},order=['Elba','Sardegna','Toscana','Corsica'];let counts={};structures.forEach(r=>counts[r.destination]=(counts[r.destination]||0)+1);let expected=Object.values(targets).reduce((a,b)=>a+b,0);$('structuresInfo').textContent=`${structures.length}/${expected} strutture censite. I numeri obiettivo derivano dal Catalogo 2026 pubblicato su napoleonviaggi.it; il censimento nominativo completo è ancora in corso e non viene considerato completo finché non sono state verificate tutte le strutture.`;$('structureCounters').innerHTML=`<div class=\"kpi\"><small>Totale censite</small><b>${structures.length}/${expected}</b></div>`+order.map(d=>`<div class=\"kpi\"><small>${d}</small><b>${counts[d]||0}/${targets[d]}</b></div>`).join('');$('structuresBody').innerHTML=rr.map(r=>`<tr><td>${esc(r.destination)}</td><td><b>${esc(r.canonical_name)}</b></td><td>${r.napoleon_active?'ATTIVA':'NON ATTIVA'}</td><td>${esc(r.source)}</td><td>${esc(r.notes)}</td></tr>`).join('')}"
          new="function renderStructures(){let q=$('strq').value.trim().toLowerCase(),rr=structures.filter(r=>!q||(r.canonical_name+' '+r.destination+' '+(r.locality||'')).toLowerCase().includes(q)),order=['Elba','Sardegna','Toscana','Corsica'],active=structures.filter(r=>r.napoleon_active&&r.live_napoleon_status==='live'),counts={};active.forEach(r=>counts[r.destination]=(counts[r.destination]||0)+1);let pending=structures.length-active.length;$('structuresInfo').textContent=`${active.length} strutture master attive nel DB, rilevate dal censimento PHP live Napoleon. ${pending} record restano da riconciliare/non visti nel censimento corrente.`;$('structureCounters').innerHTML=`<div class=\"kpi\"><small>Totale attive</small><b>${active.length}</b></div>`+order.map(d=>`<div class=\"kpi\"><small>${d}</small><b>${counts[d]||0}</b></div>`).join('');$('structuresBody').innerHTML=rr.map(r=>`<tr><td>${esc(r.destination)}</td><td><b>${esc(r.canonical_name)}</b>${r.locality?`<div class=\"small\">${esc(r.locality)}</div>`:''}</td><td>${r.napoleon_active&&r.live_napoleon_status==='live'?'ATTIVA LIVE':'DA RICONCILIARE'}</td><td>${esc(r.source)}</td><td>${esc(r.notes)}</td></tr>`).join('')}"
          reps.append((old,new))
          for old,new in reps:
            if old not in s:
              raise SystemExit('Pattern non trovato: '+old[:120])
            s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
      - name: Commit patch
        run: |
          git config user.name "Napoleon Audit Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Update audit UI coverage and table layout"
          git push
