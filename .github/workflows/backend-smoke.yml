name: Napoleon Audit backend smoke test
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check protected endpoint and CORS
        shell: bash
        run: |
          set -euo pipefail
          API='https://nohwlxuyxcdxihpleooh.supabase.co/functions/v1/napoleon-audit-api-v4'
          code=$(curl -sS -o /tmp/body -w '%{http_code}' -H 'Origin: https://napoleonviaggi.github.io' "$API?api=audit-data")
          test "$code" = '401'
          grep -q 'Accesso richiesto' /tmp/body
          headers=$(curl -sSI -X OPTIONS -H 'Origin: https://napoleonviaggi.github.io' -H 'Access-Control-Request-Method: POST' "$API?api=login-options")
          printf '%s' "$headers" | tr -d '\r' | grep -qi '^access-control-allow-origin: https://napoleonviaggi.github.io$'
          echo 'Backend protected endpoint and CORS: OK'
