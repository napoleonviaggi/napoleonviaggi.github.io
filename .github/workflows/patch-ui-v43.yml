name: Patch Audit UI V4.3
on:
  push:
    branches: [main]
    paths: ['.github/workflows/patch-ui-v43.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index.html
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          reps=[]
          reps.append((
            '.topkpis{grid-template-columns:repeat(9,minmax(85px,1fr))}.kpi{background:#fff;border:1px solid var(--ln);border-radius:9px;padding:9px}',
            '.topkpis{grid-template-columns:repeat(9,minmax(85px,1fr))}.kpi{background:#fff;border:1px solid var(--ln);border-radius:9px;padding:9px}.kpi.advance{border:2px solid #e4b63b;box-shadow:0 0 0 0 rgba(228,182,59,.38);animation:advancePulse 1.8s ease-in-out infinite}@keyframes advancePulse{0%,100%{box-shadow:0 0 0 0 rgba(228,182,59,.18);border-color:#e4b63b}50%{box-shadow:0 0 0 5px rgba(228,182,59,.12);border-color:#f0ca61}}'
          ))
          reps.append(('V4.2 · lavoro sincronizzato · storico campagne · presa in carico · censimento live','V4.3 · lavoro sincronizzato · storico campagne · presa in carico · censimento live'))
          old_top='<section class="kpis topkpis"><div class="kpi"><small>Da controllare</small><b id="kp">0</b></div><div class="kpi"><small>In carico</small><b id="ki">0</b></div><div class="kpi"><small>Verificati / fatti</small><b id="kv">0</b></div><div class="kpi"><small>Non da controllare</small><b id="kb">0</b></div><div class="kpi"><small>Risolti / OK</small><b id="ko">0</b></div><div class="kpi"><small>File USO INTERNO</small><b id="kf">0</b></div><div class="kpi"><small>Strutture con USO INT.</small><b><span id="ks">0</span>/<span id="kt">0</span></b></div><div class="kpi"><small>USO INTERNO mancanti</small><b id="km">0</b></div><div class="kpi"><small>Avanzamento</small><b><span id="kd">0</span>/<span id="ka">0</span></b><div class="bar"><i id="prog"></i></div></div></section>'
          new_top='<section class="kpis topkpis"><div class="kpi advance"><small>Avanzamento</small><b><span id="kd">0</span>/<span id="ka">0</span></b><div class="bar"><i id="prog"></i></div></div><div class="kpi"><small>Da controllare</small><b id="kp">0</b></div><div class="kpi"><small>In carico</small><b id="ki">0</b></div><div class="kpi"><small>Verificati / fatti</small><b id="kv">0</b></div><div class="kpi"><small>Non da controllare</small><b id="kb">0</b></div><div class="kpi"><small>Risolti / OK</small><b id="ko">0</b></div><div class="kpi"><small>File USO INTERNO</small><b id="kf">0</b></div><div class="kpi"><small>Strutture con USO INT.</small><b><span id="ks">0</span>/<span id="kt">0</span></b></div><div class="kpi"><small>USO INTERNO mancanti</small><b id="km">0</b></div></section>'
          reps.append((old_top,new_top))
          reps.append((
            '<colgroup><col style="width:7%"><col style="width:2.5%"><col style="width:6%"><col style="width:5%"><col style="width:5.5%"><col style="width:2.5%"><col style="width:5%"><col style="width:9.5%"><col style="width:50%"><col style="width:7%"></colgroup>',
            '<colgroup><col style="width:7%"><col style="width:4.5%"><col style="width:6%"><col style="width:7%"><col style="width:7.5%"><col style="width:2.5%"><col style="width:5%"><col style="width:9.5%"><col style="width:44%"><col style="width:7%"></colgroup>'
          ))
          for old,new in reps:
            if old not in s:
              raise SystemExit('Pattern non trovato: '+old[:140])
            s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
      - name: Commit patch
        run: |
          git config user.name "Napoleon Audit Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Refine audit layout and highlight progress"
          git push
